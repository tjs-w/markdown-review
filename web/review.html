<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fa;
        --paper: #ffffff;
        --ink: #1f2328;
        --muted: #59636e;
        --line: #d0d7de;
        --control-line: #8c959f;
        --soft: #f6f8fa;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
        --on-accent: #ffffff;
        --danger: #cf222e;
        --warning: #9a6700;
        --warning-soft: #fff8c5;
        --success: #1a7f37;
        --shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
        --shadow-small: 0 3px 12px rgba(140, 149, 159, 0.16);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #181a1e;
        --paper: #212429;
        --ink: #d8dce2;
        --muted: #a0a7b0;
        --line: #3a3f46;
        --control-line: #6e7681;
        --soft: #292d33;
        --accent: #91b4f2;
        --accent-soft: #2a374b;
        --on-accent: #172033;
        --danger: #e99a92;
        --warning: #d29922;
        --warning-soft: #3d2f12;
        --success: #89c99a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        --shadow-small: 0 3px 14px rgba(0, 0, 0, 0.26);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
      body, button, textarea {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
      }
      body { font-size: 14px; line-height: 1.5; }
      button { color: inherit; }
      button:focus-visible, textarea:focus-visible, a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] { display: none !important; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }

      .launcher {
        display: flex; align-items: center; min-height: 68px; padding: 9px;
        background: var(--bg);
      }
      .launcher-button {
        display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px;
        padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
        background: var(--paper); cursor: pointer; text-align: left;
      }
      .launcher-button:hover { border-color: var(--accent); background: var(--soft); }
      .launcher-icon {
        display: grid; place-items: center; flex: 0 0 34px; width: 34px; height: 34px;
        border-radius: 8px; background: var(--accent-soft); color: var(--accent);
      }
      .launcher-copy { min-width: 0; flex: 1; }
      .launcher-title { display: block; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .launcher-meta { display: block; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .launcher-arrow { display: grid; place-items: center; color: var(--muted); }
      .launcher-arrow .ui-icon { width: 17px; height: 17px; }

      .full-surface { display: none; min-height: 100vh; }
      html[data-surface="review"] .full-surface { display: block; }
      html[data-surface="review"] .launcher { display: none; }
      .topbar {
        position: sticky; top: 0; z-index: 30;
        display: flex; align-items: center; gap: 12px;
        min-height: 58px; padding: 10px 16px; border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px);
      }
      .identity { min-width: 0; flex: 1; }
      .title { overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .meta { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      h1.title { margin: 0; font-size: 14px; line-height: 1.35; }
      .review-help { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .review-help kbd { font: inherit; }
      .actions, .composer-actions, .card-actions { display: flex; align-items: center; gap: 7px; }
      .button {
        min-height: 40px; padding: 7px 12px; border: 1px solid var(--control-line); border-radius: 7px;
        background: var(--paper); cursor: pointer; font-size: 13px; font-weight: 550;
      }
      .button.with-icon { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
      .button:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
      .button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
      .button.danger { color: var(--danger); }
      .button:disabled { opacity: .5; cursor: default; }
      .icon-button {
        display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
        border: 1px solid var(--control-line); border-radius: 7px; background: var(--paper); cursor: pointer;
      }
      .icon-button:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
      .icon-button:active:not(:disabled), .button:active:not(:disabled) { transform: translateY(1px); }
      .icon-button.compact {
        width: 32px; height: 32px; border-color: transparent; border-radius: 6px; background: transparent;
      }
      .ui-icon {
        flex: 0 0 auto; width: 16px; height: 16px; fill: currentColor; stroke: none;
      }
      .theme-icon-sun { display: none; }
      html[data-theme="dark"] .theme-icon-moon { display: none; }
      html[data-theme="dark"] .theme-icon-sun { display: block; }
      .queue-count {
        display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px;
        margin-left: 5px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
        font-size: 11px; font-weight: 700;
      }

      .workspace { min-height: calc(100vh - 58px); padding: 24px 24px 92px; }
      .paper {
        width: min(980px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 56px);
        border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow);
      }
      .markdown {
        color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 16px; line-height: 1.5; overflow-wrap: break-word;
      }
      .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 {
        margin: 24px 0 16px; font-weight: 600; line-height: 1.25;
      }
      .markdown h1 { margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--line); font-size: 2em; }
      .markdown h2 { padding-bottom: .3em; border-bottom: 1px solid var(--line); font-size: 1.5em; }
      .markdown h3 { font-size: 1.25em; }
      .markdown h4 { font-size: 1em; }
      .markdown h5 { font-size: .875em; }
      .markdown h6 { color: var(--muted); font-size: .85em; }
      .markdown p, .markdown blockquote, .markdown ul, .markdown ol, .markdown pre, .markdown table { margin: 0 0 16px; }
      .markdown ul, .markdown ol { padding-left: 2em; }
      .markdown li + li { margin-top: .25em; }
      .markdown a { color: var(--accent); text-decoration: underline; text-underline-offset: .16em; }
      .markdown a:hover { text-decoration-thickness: 2px; }
      .markdown blockquote { padding: 0 1em; border-left: .25em solid var(--line); color: var(--muted); }
      .markdown code {
        padding: .2em .4em; border-radius: 6px; background: var(--soft);
        font: 85%/1.45 ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      }
      .markdown pre { overflow: auto; padding: 16px; border-radius: 6px; background: var(--soft); }
      .markdown pre code { padding: 0; background: transparent; font-size: 100%; }
      .markdown table { display: block; width: max-content; max-width: 100%; overflow: auto; border-spacing: 0; border-collapse: collapse; }
      .markdown th, .markdown td { padding: 6px 13px; border: 1px solid var(--line); }
      .markdown tr:nth-child(2n) { background: var(--soft); }
      .markdown hr { height: .25em; margin: 24px 0; border: 0; background: var(--line); }
      .markdown canvas.local-image-canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; }
      .markdown img { display: block; max-width: 100%; height: auto; }
      .local-image {
        display: grid; place-items: center; min-height: 120px; margin-bottom: 16px; padding: 18px;
        border: 1px dashed var(--line); border-radius: 6px; background: var(--soft); text-align: center;
      }
      .local-image-status { color: var(--muted); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .local-image.is-error .local-image-status { color: var(--danger); }
      .image-retry { margin-top: 10px; }

      .review-block { position: relative; border-radius: 4px; outline: 0 solid transparent; }
      .review-block.has-comments { box-shadow: inset -2px 0 var(--accent-soft); }
      .review-block.is-selected {
        background: color-mix(in srgb, var(--accent-soft) 38%, transparent);
        box-shadow: inset 3px 0 var(--accent);
        outline: 0;
      }
      .selection-action {
        position: fixed; z-index: 60; display: grid; place-items: center;
        width: 32px; height: 32px; padding: 0;
        border: 1px solid var(--accent); border-radius: 50%; background: var(--paper);
        color: var(--accent); box-shadow: var(--shadow); cursor: pointer;
      }
      .selection-action .ui-icon { width: 16px; height: 16px; }
      .selection-action:hover { background: var(--accent); color: var(--on-accent); }
      .annotation-badge {
        position: absolute; z-index: 20; display: grid; place-items: center;
        right: -38px; width: 30px; height: 30px; padding: 0; transform: translateY(4px);
        border: 2px solid var(--paper); border-radius: 50%; background: var(--accent);
        color: var(--on-accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-small);
        cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1; user-select: none;
      }
      .annotation-badge::before { position: absolute; inset: -7px; content: ""; }
      .annotation-badge:hover { filter: brightness(1.08); transform: translateY(3px) scale(1.04); }
      .annotation-badge.is-stale { background: var(--warning); box-shadow: 0 0 0 1px var(--warning), var(--shadow-small); }
      .inline-composer {
        position: relative; width: min(440px, calc(100% - 12px)); margin: 8px 0 14px auto;
        padding: 10px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--paper); box-shadow: 0 8px 24px rgba(140, 149, 159, .18);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      html[data-theme="dark"] .inline-composer { box-shadow: 0 10px 28px rgba(0, 0, 0, .34); }
      .inline-composer::before {
        position: absolute; top: -5px; right: 18px; width: 9px; height: 9px;
        border-top: 1px solid var(--line); border-left: 1px solid var(--line);
        background: var(--paper); content: ""; transform: rotate(45deg);
      }
      .composer-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
      .inline-composer .composer-title {
        flex: 1; margin: 0; padding: 0; border: 0; font-size: 13px; font-weight: 650; line-height: 1.3;
      }
      .line-pill {
        padding: 2px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
        font: 600 10px/1.5 ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      }
      .inline-composer .quote {
        display: -webkit-box; max-height: 40px; overflow: hidden; margin: 0 0 8px; padding: 5px 8px;
        border-left: 2px solid var(--line); background: var(--soft); color: var(--muted);
        font-size: 11px; line-height: 1.4; white-space: normal; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      }
      textarea {
        width: 100%; min-height: 64px; max-height: 120px; resize: none; padding: 8px 10px;
        border: 1px solid var(--control-line); border-radius: 7px; background: var(--paper); color: var(--ink); font-size: 13px;
      }
      .composer-help-popover {
        position: absolute; top: 42px; right: 42px; z-index: 4; width: min(248px, calc(100% - 24px));
        padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px;
        background: var(--paper); box-shadow: var(--shadow-small); color: var(--ink);
      }
      .inline-composer .composer-help-title { margin: 0 0 7px; font-size: 11px; font-weight: 650; }
      .composer-help-grid { display: grid; grid-template-columns: max-content 1fr; gap: 5px 10px; margin: 0; font-size: 11px; }
      .composer-help-grid dt, .composer-help-grid dd { margin: 0; }
      .composer-help-grid dd { color: var(--muted); }
      .composer-help-grid kbd, .composer-help-grid code {
        display: inline-flex; min-height: 20px; align-items: center; padding: 1px 5px;
        border: 1px solid var(--line); border-radius: 5px; background: var(--soft);
        color: var(--ink); font: 10px/1.2 ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      }
      .composer-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: 7px; }
      .inline-composer .reference-help { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
      .reference-help:empty { display: none; }
      .reference-help.warning { color: var(--warning); }
      .composer-actions .button { min-height: 34px; padding: 5px 11px; font-size: 12px; }

      .queued-group { margin: 8px 0 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .queued-card { margin-top: 7px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; background: var(--soft); }
      .card-head { display: flex; align-items: center; gap: 8px; }
      .card-label { flex: 1; color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
      .card-feedback { margin: 6px 0 8px; white-space: pre-wrap; font-size: 13px; }
      .card-quote { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .card-actions { flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }
      .card-actions .button { min-height: 36px; padding: 5px 9px; font-size: 12px; }
      .status-chip { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 650; }
      .status-chip.sent { background: var(--soft); color: var(--muted); }
      .status-chip.warning { background: var(--warning-soft); color: var(--warning); }

      .comments-scrim { position: fixed; inset: 58px 0 0; z-index: 41; background: rgba(31, 35, 40, .18); }
      .comments-panel {
        position: fixed; top: 58px; right: 0; bottom: 0; z-index: 42;
        display: flex; flex-direction: column; width: min(380px, 100vw);
        border-left: 1px solid var(--control-line); background: var(--paper); box-shadow: var(--shadow);
      }
      .comments-head { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
      .comments-title { flex: 1; margin: 0; font-size: 15px; }
      .comments-list { display: grid; gap: 10px; overflow: auto; padding: 12px; }
      .comment-index-item { padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
      .comment-index-head { display: flex; align-items: center; gap: 7px; }
      .comment-index-serial { color: var(--accent); font-weight: 700; }
      .comment-index-quote { overflow: hidden; margin-top: 7px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .comment-index-feedback { margin-top: 4px; font-size: 13px; white-space: pre-wrap; }
      .comment-index-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
      .comment-index-actions .button { min-height: 36px; padding: 5px 9px; font-size: 12px; }
      .empty { display: grid; place-items: center; min-height: 300px; padding: 30px; color: var(--muted); text-align: center; }
      .error { color: var(--danger); }
      .toast {
        position: fixed; left: 50%; bottom: 20px; z-index: 80; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 7px; background: var(--ink); color: var(--paper);
        opacity: 0; pointer-events: none; transition: opacity .16s;
      }
      .toast.show { opacity: 1; pointer-events: auto; }
      .toast-action { min-height: 30px; padding: 3px 7px; border: 1px solid currentColor; border-radius: 5px; background: transparent; color: inherit; cursor: pointer; font-weight: 650; }
      @media (max-width: 700px) {
        .workspace { padding: 0; }
        .paper { padding: 24px 20px 80px; border: 0; border-radius: 0; box-shadow: none; }
        .actions .label { display: none; }
        .review-help .shortcut { display: none; }
        .annotation-badge { right: -16px; }
        .inline-composer { width: 100%; margin-top: 8px; }
        .card-actions .button { flex: 1 1 42%; }
      }
      @media (max-width: 520px) {
        .inline-composer .composer-help-popover {
          top: 41px; right: -1px; bottom: -1px; left: -1px; width: auto;
          border-radius: 0 0 8px 8px; box-shadow: none;
        }
      }
      @media (max-width: 430px) {
        .topbar { gap: 7px; padding: 8px; }
        .actions { gap: 5px; }
        .button, .icon-button { min-height: 38px; }
        .icon-button { width: 38px; height: 38px; }
        .comments-panel { top: 54px; }
        .comments-scrim { inset-block-start: 54px; }
      }
      @media (pointer: coarse) {
        .inline-composer .icon-button.compact { width: 40px; height: 40px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; }
        .annotation-badge:hover, .icon-button:active:not(:disabled), .button:active:not(:disabled) { transform: none; }
      }
      @media (forced-colors: active) {
        .paper, .inline-composer, .queued-card, .comment-index-item, .comments-panel, button, textarea { border-color: CanvasText; }
        .review-block.is-selected { outline: 2px solid Highlight; }
        .annotation-badge { border-color: Canvas; outline: 2px solid ButtonText; background: ButtonFace; color: ButtonText; }
      }
    </style>
  </head>
  <body>
    <div class="launcher" id="launcher">
      <button class="launcher-button" id="open-review" type="button" aria-label="Open Markdown review fullscreen">
        <span class="launcher-icon" aria-hidden="true">
          <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"></path>
          </svg>
        </span>
        <span class="launcher-copy">
          <span class="launcher-title" id="launcher-title">Markdown Review</span>
          <span class="launcher-meta" id="launcher-meta">Open fullscreen review</span>
        </span>
        <span class="queue-count" id="launcher-count" hidden>0</span>
        <span class="launcher-arrow" aria-hidden="true">
          <svg class="ui-icon" viewBox="0 0 16 16"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"></path></svg>
        </span>
      </button>
    </div>

    <div class="full-surface">
      <header class="topbar">
        <div class="identity">
          <h1 class="title" id="title">Markdown Review</h1>
          <div class="meta" id="meta" role="status" aria-live="polite">Waiting for the document…</div>
          <div class="review-help">Select text to add a comment<span class="shortcut"> · <kbd>⌘/Ctrl + Shift + M</kbd></span></div>
        </div>
        <div class="actions">
          <button class="button with-icon" id="comments-toggle" type="button" aria-expanded="false" aria-controls="comments-panel">
            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 1h8.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 10.25 10H7.061l-2.574 2.573A1.458 1.458 0 0 1 2 11.543V10h-.25A1.75 1.75 0 0 1 0 8.25v-5.5C0 1.784.784 1 1.75 1ZM1.5 2.75v5.5c0 .138.112.25.25.25h1a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h3.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25Zm13 2a.25.25 0 0 0-.25-.25h-.5a.75.75 0 0 1 0-1.5h.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 14.25 12H14v1.543a1.458 1.458 0 0 1-2.487 1.03L9.22 12.28a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.22 2.22v-2.19a.75.75 0 0 1 .75-.75h1a.25.25 0 0 0 .25-.25Z"></path></svg>
            <span class="label">Comments</span><span class="queue-count" id="top-count">0</span>
          </button>
          <button class="button primary with-icon" id="send-all" type="button" hidden>
            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M.989 8 .064 2.68a1.342 1.342 0 0 1 1.85-1.462l13.402 5.744a1.13 1.13 0 0 1 0 2.076L1.913 14.782a1.343 1.343 0 0 1-1.85-1.463L.99 8Zm.603-5.288L2.38 7.25h4.87a.75.75 0 0 1 0 1.5H2.38l-.788 4.538L13.929 8Z"></path></svg>
            <span class="label" id="send-all-label">Send all</span><span id="send-all-count">(0)</span>
          </button>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><span id="toast-message"></span><button class="toast-action" id="toast-action" type="button" hidden></button></div>
    <div class="sr-only" id="selection-status" role="status" aria-live="polite" aria-atomic="true"></div>
    <!-- MARKDOWN_REVIEW_PNG_DECODER -->
    <script>
      const MCP_APPS_PROTOCOL_VERSION = "2026-01-26";
      const IMAGE_WORKERS = 2;
      const CHUNK_WORKERS = 4;
      const MAX_QUEUE_ITEMS = 20;
      const appState = {
        document: null,
        lastGoodDocument: null,
        pendingSelection: null,
        selection: null,
        editingId: null,
        queue: [],
        pending: new Map(),
        requestId: 1,
        bridgeInitialized: false,
        generation: 0,
        renderKey: null,
        activeLoad: null,
        privateState: null,
        fullscreenRequestedFor: null,
        queueId: 0,
        nextSerial: 1,
        sendingIds: new Set(),
        returnFocus: null,
        lastSelectionAnnouncement: null,
      };
      const $ = (id) => document.getElementById(id);

      function deepFindDocument(value, depth = 0, seen = new Set()) {
        if (!value || typeof value !== "object" || depth > 7 || seen.has(value)) return null;
        seen.add(value);
        if (value.kind === "markdown-review-document") return value;
        if (value.document?.kind === "markdown-review-document") return value.document;
        for (const key of ["_meta", "meta", "mcp_tool_result", "call_tool_result", "toolResponseMetadata", "result", "params"]) {
          const found = deepFindDocument(value[key], depth + 1, seen);
          if (found) return found;
        }
        return null;
      }
      function deepFindPath(value, depth = 0, seen = new Set()) {
        if (!value || typeof value !== "object" || depth > 7 || seen.has(value)) return null;
        seen.add(value);
        if (typeof value.path === "string" && /\.(?:md|markdown)$/i.test(value.path)) return value.path;
        for (const key of ["structuredContent", "toolOutput", "toolInput", "_meta", "meta", "mcp_tool_result", "call_tool_result", "toolResponseMetadata", "result", "params"]) {
          const found = deepFindPath(value[key], depth + 1, seen);
          if (found) return found;
        }
        return null;
      }
      function deepFindImageChunk(value, depth = 0, seen = new Set()) {
        if (!value || typeof value !== "object" || depth > 6 || seen.has(value)) return null;
        seen.add(value);
        if (value.kind === "markdown-review-image-chunk" && typeof value.data === "string") return value;
        for (const key of ["_meta", "imageChunk", "meta", "result", "params", "structuredContent"]) {
          const found = deepFindImageChunk(value[key], depth + 1, seen);
          if (found) return found;
        }
        return null;
      }
      function hostGlobals() { return window.openai ?? {}; }
      function currentDisplayMode() { return document.documentElement.dataset.displayMode ?? "inline"; }
      function reviewSurfaceVisible() { return document.documentElement.dataset.surface === "review"; }
      function currentTheme() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
      function documentKey(doc) { return doc?.path && doc?.revision ? doc.path + "\n" + doc.revision : null; }
      function lineLabel(selection) {
        if (!selection) return "No selection";
        return selection.startLine === selection.endLine
          ? "Line " + selection.startLine
          : "Lines " + selection.startLine + "–" + selection.endLine;
      }
      function prefersReducedMotion() {
        return Boolean(window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches);
      }
      function scrollBehavior() { return prefersReducedMotion() ? "auto" : "smooth"; }
      function toast(message, { actionLabel = null, onAction = null } = {}) {
        const el = $("toast");
        const action = $("toast-action");
        $("toast-message").textContent = message;
        action.hidden = !actionLabel;
        action.textContent = actionLabel || "";
        action.onclick = actionLabel && onAction ? () => {
          clearTimeout(toast.timer);
          el.classList.remove("show");
          action.hidden = true;
          onAction();
        } : null;
        el.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => {
          el.classList.remove("show");
          action.hidden = true;
        }, actionLabel ? 5200 : 2600);
      }
      function setBusy(busy) {
        $("document").setAttribute("aria-busy", String(Boolean(busy)));
        $("refresh").disabled = Boolean(busy);
      }
      function setMeta(message, { error = false } = {}) {
        $("meta").textContent = message;
        $("meta").classList.toggle("error", error);
        $("meta").setAttribute("role", error ? "alert" : "status");
      }
      function syncSurfaceLayout({ forceReview = false } = {}) {
        const wasVisible = reviewSurfaceVisible();
        const hasPanelViewport = Number(window.innerHeight) >= 320;
        const shouldShowReview = forceReview || currentDisplayMode() !== "inline" || hasPanelViewport;
        document.documentElement.dataset.surface = shouldShowReview ? "review" : "launcher";
        if (wasVisible !== shouldShowReview && appState.document) {
          void installLocalImages(appState.document, appState.document.images, appState.generation);
          hostGlobals().notifyIntrinsicHeight?.(document.documentElement.scrollHeight);
        }
      }
      function applyTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        const toggle = $("theme-toggle");
        const useDark = nextTheme === "light";
        toggle.title = useDark ? "Use dark theme" : "Use light theme";
        toggle.setAttribute("aria-label", toggle.title);
        toggle.setAttribute("aria-pressed", String(nextTheme === "dark"));
      }
      function toggleTheme() {
        applyTheme(currentTheme() === "light" ? "dark" : "light");
        persistUiState();
      }
      function syncHostAppearance(globals = hostGlobals()) {
        applyTheme(appState.privateState?.theme ?? "light");
        document.documentElement.dataset.displayMode = globals.displayMode ?? "inline";
        syncSurfaceLayout();
      }

      function normalizeQueueItem(item) {
        if (!item || typeof item !== "object") return null;
        if (typeof item.id !== "string" || typeof item.path !== "string" || typeof item.feedback !== "string") return null;
        const startLine = Number(item.startLine);
        const endLine = Number(item.endLine);
        const anchorX = Number(item.anchorX);
        const anchorY = Number(item.anchorY);
        if (!Number.isInteger(startLine) || !Number.isInteger(endLine)) return null;
        return {
          id: item.id.slice(0, 120),
          serial: Number.isInteger(Number(item.serial)) && Number(item.serial) > 0 ? Number(item.serial) : null,
          path: item.path,
          revision: typeof item.revision === "string" ? item.revision.slice(0, 128) : "",
          startLine,
          endLine,
          anchorX: Number.isFinite(anchorX) ? Math.max(0, Math.min(1, anchorX)) : 0.96,
          anchorY: Number.isFinite(anchorY) ? Math.max(0, Math.min(1, anchorY)) : 1,
          quote: String(item.quote || "").slice(0, 1400),
          feedback: item.feedback.slice(0, 2400),
          createdAt: typeof item.createdAt === "string" ? item.createdAt : new Date().toISOString(),
        };
      }
      function normalizePrivateState(value) {
        const state = value && typeof value === "object" ? value : {};
        const queue = Array.isArray(state.queue)
          ? state.queue.map(normalizeQueueItem).filter(Boolean).slice(0, MAX_QUEUE_ITEMS)
          : [];
        const usedSerials = new Set();
        let availableSerial = 1;
        for (const item of queue) {
          if (!item.serial || usedSerials.has(item.serial)) {
            while (usedSerials.has(availableSerial)) availableSerial += 1;
            item.serial = availableSerial;
          }
          usedSerials.add(item.serial);
          availableSerial = Math.max(availableSerial, item.serial + 1);
        }
        const storedNextSerial = Number(state.nextSerial);
        return {
          path: typeof state.path === "string" ? state.path : null,
          theme: state.theme === "dark" ? "dark" : "light",
          queue,
          nextSerial: queue.length && Number.isInteger(storedNextSerial) && storedNextSerial > 0
            ? Math.max(storedNextSerial, availableSerial)
            : queue.length ? availableSerial : 1,
          lastSubmission: state.lastSubmission && typeof state.lastSubmission === "object" ? state.lastSubmission : null,
        };
      }
      function persistUiState() {
        appState.privateState = normalizePrivateState({
          path: appState.document?.path,
          theme: currentTheme(),
          queue: appState.queue,
          nextSerial: appState.nextSerial,
          lastSubmission: appState.privateState?.lastSubmission,
        });
        hostGlobals().setWidgetState?.({ privateContent: appState.privateState });
      }
      function nextQueueId() {
        appState.queueId += 1;
        return "feedback-" + Date.now() + "-" + appState.queueId;
      }
      function nextCommentSerial() {
        const serial = appState.nextSerial;
        appState.nextSerial += 1;
        return serial;
      }
      function makeQueueItem(selection, feedback, id = nextQueueId(), serial = nextCommentSerial()) {
        return {
          id,
          serial,
          path: appState.document.path,
          revision: appState.document.revision,
          startLine: selection.startLine,
          endLine: selection.endLine,
          anchorX: Number.isFinite(selection.anchorX) ? Math.max(0, Math.min(1, selection.anchorX)) : 0.96,
          anchorY: Number.isFinite(selection.anchorY) ? Math.max(0, Math.min(1, selection.anchorY)) : 1,
          quote: selection.quote,
          feedback: feedback.trim().slice(0, 2400),
          createdAt: new Date().toISOString(),
        };
      }

      function updateQueueUi() {
        const count = appState.queue.length;
        const total = allComments().length;
        const sending = appState.sendingIds.size > 0;
        $("launcher-count").hidden = count === 0;
        $("launcher-count").textContent = String(count);
        $("top-count").textContent = String(total);
        $("comments-toggle").setAttribute("aria-label", total === 1 ? "Open 1 review comment" : "Open " + total + " review comments");
        $("send-all").hidden = count === 0;
        $("send-all-label").textContent = sending ? "Sending…" : "Send all";
        $("send-all-count").textContent = "(" + count + ")";
        const composerOpen = !$("review-composer").hidden;
        $("send-all").disabled = count === 0 || sending || composerOpen;
        $("send-all").setAttribute("aria-label", sending
          ? "Sending review feedback"
          : composerOpen
            ? "Queue or close the open comment before sending all feedback"
            : "Send all " + count + " queued comments");
        $("launcher-meta").textContent = count
          ? count + (count === 1 ? " feedback item queued" : " feedback items queued")
          : "Open fullscreen review";
        renderCommentsPanel();
      }
      function allComments() {
        return appState.queue
          .filter((item) => item.path === appState.document?.path)
          .sort((left, right) => left.serial - right.serial);
      }
      function isQueuedComment(item) {
        return appState.queue.some((candidate) => candidate.id === item.id);
      }
      function itemIsStale(item) {
        return Boolean(item.revision && appState.document?.revision && item.revision !== appState.document.revision);
      }
      function normalizedReviewText(value) {
        return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
      }
      function findAnchorBlock(item) {
        const blocks = [...document.querySelectorAll(".review-block")];
        if (itemIsStale(item) && item.quote) {
          const quote = normalizedReviewText(item.quote);
          const relocated = blocks.find((block) => quote && normalizedReviewText(block.innerText).includes(quote));
          if (relocated) return relocated;
        }
        return blocks.find((block) => {
          const start = Number(block.dataset.startLine);
          const end = Number(block.dataset.endLine);
          return item.startLine >= start && item.startLine <= end;
        }) ?? blocks.find((block) => Number(block.dataset.startLine) >= item.startLine) ?? blocks.at(-1);
      }
      function renderQueueCards() {
        document.querySelectorAll(".queued-group").forEach((element) => element.remove());
        document.querySelectorAll(".annotation-badge").forEach((element) => element.remove());
        document.querySelectorAll(".review-block.has-comments").forEach((element) => element.classList.remove("has-comments"));
        const groups = new Map();
        const stacks = new Map();
        for (const item of appState.queue) {
          if (item.path !== appState.document?.path) continue;
          const serial = item.serial;
          const block = findAnchorBlock(item);
          if (!block) continue;
          block.classList.add("has-comments");
          const stackKey = Math.round(item.anchorY * 20);
          const blockStacks = stacks.get(block) ?? new Map();
          const stackIndex = blockStacks.get(stackKey) ?? 0;
          blockStacks.set(stackKey, stackIndex + 1);
          stacks.set(block, blockStacks);
          const badge = document.createElement("button");
          badge.type = "button";
          badge.className = "annotation-badge";
          badge.dataset.feedbackAnnotation = item.id;
          badge.textContent = String(serial);
          badge.style.top = "calc(" + (item.anchorY * 100) + "% + " + (stackIndex * 22) + "px)";
          badge.classList.toggle("is-stale", itemIsStale(item));
          badge.disabled = appState.sendingIds.size > 0;
          badge.title = "Comment " + serial + ": " + parseCommentFeedback(item.feedback).text.slice(0, 160);
          badge.setAttribute("aria-label", "Edit queued comment " + serial + " for " + lineLabel(item) + (itemIsStale(item) ? "; source changed" : ""));
          block.appendChild(badge);
          if (!groups.has(block)) groups.set(block, []);
          groups.get(block).push(item);
        }
        for (const [block, items] of groups) {
          const group = document.createElement("section");
          group.className = "queued-group";
          group.setAttribute("aria-label", "Queued feedback for " + lineLabel(items[0]));
          for (const item of items) {
            const card = document.createElement("article");
            card.className = "queued-card";
            card.dataset.feedbackId = item.id;
            const labelId = "queued-comment-label-" + item.serial;
            card.setAttribute("aria-labelledby", labelId);
            const head = document.createElement("div");
            head.className = "card-head";
            const label = document.createElement("span");
            label.className = "card-label";
            label.id = labelId;
            label.textContent = "Comment " + item.serial + " · " + lineLabel(item);
            head.appendChild(label);
            if (itemIsStale(item)) {
              const stale = document.createElement("span");
              stale.className = "status-chip warning";
              stale.textContent = "Source changed";
              head.appendChild(stale);
            }
            const quote = document.createElement("div");
            quote.className = "card-quote";
            quote.textContent = item.quote || "Markdown passage";
            const feedback = document.createElement("div");
            feedback.className = "card-feedback";
            feedback.textContent = parseCommentFeedback(item.feedback).text;
            const actions = document.createElement("div");
            actions.className = "card-actions";
            for (const [action, text, className] of [
              ["edit", "Edit", "button"],
              ["remove", "Remove", "button danger"],
            ]) {
              const button = document.createElement("button");
              button.type = "button";
              button.className = className;
              button.dataset.queueAction = action;
              button.textContent = text;
              button.disabled = appState.sendingIds.size > 0;
              button.setAttribute("aria-label", text + " for comment " + item.serial + ", " + lineLabel(item));
              actions.appendChild(button);
            }
            card.append(head, quote, feedback, actions);
            group.appendChild(card);
          }
          block.insertAdjacentElement("afterend", group);
        }
        updateQueueUi();
      }

      function renderCommentsPanel() {
        const list = $("comments-list");
        if (!list) return;
        list.replaceChildren();
        const comments = allComments();
        if (!comments.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No comments yet. Select text in the document to add one.";
          list.appendChild(empty);
          return;
        }
        for (const item of comments) {
          const entry = document.createElement("article");
          entry.className = "comment-index-item";
          entry.dataset.commentSerial = String(item.serial);
          entry.setAttribute("role", "listitem");
          const head = document.createElement("div");
          head.className = "comment-index-head";
          const serial = document.createElement("span");
          serial.className = "comment-index-serial";
          serial.textContent = "#" + item.serial;
          const status = document.createElement("span");
          status.className = "status-chip";
          status.textContent = "Queued";
          head.append(serial, status);
          if (itemIsStale(item)) {
            const stale = document.createElement("span");

          : [];
        appState.nextSerial = saved?.path === doc.path ? saved.nextSerial : 1;
        renderQueueCards();
      }
      async function requestFullscreen({ automatic = false } = {}) {
        if (currentDisplayMode() !== "inline") return true;
        if (!hostGlobals().requestDisplayMode) {
          if (!automatic) toast("Fullscreen is not available in this host.");
          return false;
        }
        try {
          const result = await hostGlobals().requestDisplayMode({ mode: "fullscreen" });
          if (result?.mode === "fullscreen") document.documentElement.dataset.displayMode = "fullscreen";
          syncSurfaceLayout({ forceReview: !automatic || result?.mode === "fullscreen" });
          return true;
        } catch {
          if (!automatic) toast("Could not enter fullscreen.");
          return false;
        }
      }
      function requestDefaultFullscreen(doc) {
        const key = documentKey(doc);
        if (!key || appState.fullscreenRequestedFor === key) return;
        appState.fullscreenRequestedFor = key;
        queueMicrotask(() => void requestFullscreen({ automatic: true }));
      }
      function renderDocument(doc, generation) {
        if (!doc || doc.error || !doc.path || !doc.revision) return false;
        const key = documentKey(doc);
        if (key === appState.renderKey) {
          setMeta(doc.filename + " · " + doc.lineCount + " lines · rev " + doc.revision);
          requestDefaultFullscreen(doc);
          return true;
        }
        const renderGeneration = generation ?? appState.generation + 1;
        appState.generation = Math.max(appState.generation, renderGeneration);
        appState.document = doc;
        appState.lastGoodDocument = doc;
        appState.renderKey = key;
        $("title").textContent = doc.title || doc.filename || "Markdown Review";
        $("launcher-title").textContent = doc.title || doc.filename || "Markdown Review";
        setMeta(doc.filename + " · " + doc.lineCount + " lines · rev " + doc.revision);
        closeComposer({ restoreFocus: false });
        $("document").innerHTML = doc.html || '<div class="empty">This Markdown file is empty.</div>';
        restoreReviewState(doc);
        void installLocalImages(doc, doc.images, appState.generation);
        requestDefaultFullscreen(doc);
        return true;
      }
      function acceptResult(value) {
        const doc = deepFindDocument(value);
        if (!doc || doc.error) return false;
        return renderDocument(doc);
      }
      function bridgeRequest(method, params, timeoutMs = 15000) {
        const id = appState.requestId++;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            appState.pending.delete(id);
            reject(new Error(method + " timed out"));
          }, timeoutMs);
          appState.pending.set(id, { resolve, reject, timeout });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }
      async function callServerTool(name, args) {
        if (appState.bridgeInitialized) return bridgeRequest("tools/call", { name, arguments: args });
        if (hostGlobals().callTool) return hostGlobals().callTool(name, args);
        return bridgeRequest("tools/call", { name, arguments: args });
      }
      async function hydrateFromPath(path, { force = false } = {}) {
        if (!path) return false;
        if (!force && appState.document?.path === path) return true;
        if (!force && appState.activeLoad?.path === path) return appState.activeLoad.promise;
        const generation = ++appState.generation;
        setBusy(true);
        setMeta("Loading " + (path.split("/").at(-1) ?? "Markdown") + "…");
        const promise = (async () => {
          try {
            const result = await callServerTool("load_markdown_review_document", { path });
            if (generation !== appState.generation) return false;
            const doc = deepFindDocument(result);
            if (!doc) throw new Error("The document payload was not returned to the component");
            if (doc.error) throw new Error(doc.error);
            return renderDocument(doc, generation);
          } catch (error) {
            if (generation !== appState.generation) return false;
            const message = "Could not load the review: " + (error?.message ?? error);
            setMeta(message, { error: true });
            if (!appState.lastGoodDocument) {
              $("document").innerHTML = '<div class="empty error" role="alert"></div>';
              $("document").querySelector(".error").textContent = message;
            }
            return false;
          } finally {
            if (generation === appState.generation) {
              setBusy(false);
              if (appState.activeLoad?.generation === generation) appState.activeLoad = null;
            }
          }
        })();
        appState.activeLoad = { path, generation, promise };
        return promise;
      }
      function acceptOrHydrate(value) {
        if (acceptResult(value)) return true;
        const path = deepFindPath(value);
        if (path) void hydrateFromPath(path);
        return false;
      }
      function hydrateFromGlobals(globals = hostGlobals()) {
        syncHostAppearance(globals);
        return acceptOrHydrate(globals.toolResponseMetadata)
          || acceptOrHydrate(globals.toolOutput)
          || acceptOrHydrate(globals.toolInput);
      }
      async function initializeMcpAppsBridge() {
        if (appState.bridgeInitialized) return true;
        try {
          await bridgeRequest("ui/initialize", {
            appInfo: { name: "markdown-review", version: "0.1.0" },
            appCapabilities: {},
            protocolVersion: MCP_APPS_PROTOCOL_VERSION,
          }, 5000);
          window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized" }, "*");
          appState.bridgeInitialized = true;
          return true;
        } catch { return false; }
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && !message.method && appState.pending.has(message.id)) {
          const pending = appState.pending.get(message.id);
          appState.pending.delete(message.id);
          clearTimeout(pending.timeout);
          message.error ? pending.reject(message.error) : pending.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") acceptOrHydrate(message.params);
      }, { passive: true });
      window.addEventListener("openai:set_globals", (event) => {
        const globals = event.detail?.globals ?? hostGlobals();
        const incomingState = globals.widgetState?.privateContent;
        if (incomingState) appState.privateState = normalizePrivateState(incomingState);
        hydrateFromGlobals(globals);
      }, { passive: true });
      window.addEventListener("resize", () => syncSurfaceLayout(), { passive: true });
      document.addEventListener("selectionchange", captureSelection);
      document.addEventListener("pointerdown", (event) => {
        if ($("composer-help-popover").hidden) return;
        if ($("composer-help-popover").contains(event.target) || $("composer-help-toggle").contains(event.target)) return;
        setComposerHelp(false);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("composer-help-popover").hidden) {
          event.preventDefault();
          setComposerHelp(false, { restoreFocus: true });
        } else if (event.key === "Escape" && !$("review-composer").hidden) {
          event.preventDefault();
          requestCloseComposer();
        } else if (event.key === "Escape" && !$("comments-panel").hidden) {
          event.preventDefault();
          closeCommentsPanel();
        }
        if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === "m" && appState.pendingSelection) {
          event.preventDefault();
          openComposer(appState.pendingSelection);
        }
      });
      $("selection-action").addEventListener("pointerdown", (event) => event.preventDefault());
      $("selection-action").addEventListener("click", () => openComposer(appState.pendingSelection));
      $("open-review").addEventListener("click", () => void requestFullscreen());
      $("close-composer").addEventListener("click", requestCloseComposer);
      $("composer-help-toggle").addEventListener("click", toggleComposerHelp);
      $("comments-toggle").addEventListener("click", () => {
        if ($("comments-panel").hidden) openCommentsPanel();
        else closeCommentsPanel();
      });
      $("close-comments").addEventListener("click", () => closeCommentsPanel());
      $("comments-scrim").addEventListener("click", () => closeCommentsPanel());
      $("feedback").addEventListener("input", updateComposerActions);
      $("feedback").addEventListener("focus", () => setComposerHelp(false));
      $("feedback").addEventListener("keydown", handleFeedbackKeydown);
      $("add-queue").addEventListener("click", addCurrentToQueue);
      $("send-all").addEventListener("click", () => void sendFeedbackItems());
      $("theme-toggle").addEventListener("click", toggleTheme);
      $("refresh").addEventListener("click", async () => {
        if (!appState.document?.path) return toast("No Markdown file is open.");
        const loaded = await hydrateFromPath(appState.document.path, { force: true });
        toast(loaded ? "Reloaded from the .md file." : "The last good review is still shown.");
      });
      $("document").addEventListener("click", (event) => {
        const retry = event.target.closest?.(".image-retry");
        if (retry) {
          const placeholder = retry.closest("[data-local-image-id]");
          if (placeholder && appState.document) {
            placeholder.dataset.loading = "";
            void installLocalImages(appState.document, appState.document.images, appState.generation);
          }
          return;
        }
        const annotation = event.target.closest?.("[data-feedback-annotation]");
        if (annotation) {
          const item = appState.queue.find((candidate) => candidate.id === annotation.dataset.feedbackAnnotation);
          const block = item ? findAnchorBlock(item) : null;
          if (item && block) openComposer({ ...item, block }, { editingId: item.id, feedback: item.feedback, invoker: annotation });
          return;
        }
        const queueButton = event.target.closest?.("[data-queue-action]");
        if (queueButton) {
          const card = queueButton.closest(".queued-card");
          const item = appState.queue.find((candidate) => candidate.id === card?.dataset.feedbackId);
          if (!item) return;
          const action = queueButton.dataset.queueAction;
          if (action === "remove") {
            requestRemoveComment(item);
          } else if (action === "edit") {
            const block = findAnchorBlock(item);
            openComposer({ ...item, block }, { editingId: item.id, feedback: item.feedback, invoker: queueButton });
          }
          return;
        }
        const link = event.target.closest?.(".markdown a[href]");
        const href = link?.getAttribute("href");
        if (href && !href.startsWith("#") && hostGlobals().openExternal) {
          event.preventDefault();
          hostGlobals().openExternal({ href, redirectUrl: false });
        }
      });
      $("comments-list").addEventListener("click", (event) => {
        const button = event.target.closest?.("[data-comment-action]");
        const entry = button?.closest?.("[data-comment-serial]");
        if (!button || !entry) return;
        const serial = Number(entry.dataset.commentSerial);
        const item = allComments().find((candidate) => candidate.serial === serial);
        if (!item) return;
        if (button.dataset.commentAction === "reference") insertCommentReference(serial);
        else if (button.dataset.commentAction === "go") goToComment(item);
      });

      appState.privateState = normalizePrivateState(hostGlobals().widgetState?.privateContent);
      syncHostAppearance();
      hydrateFromGlobals();
      void initializeMcpAppsBridge().then(() => hydrateFromGlobals());
    </script>
  </body>
</html>
