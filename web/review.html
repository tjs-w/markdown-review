<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Review</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fa;
        --paper: #ffffff;
        --ink: #1f2328;
        --muted: #59636e;
        --line: #d0d7de;
        --control-line: #8c959f;
        --soft: #f6f8fa;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
        --on-accent: #ffffff;
        --danger: #cf222e;
        --warning: #9a6700;
        --warning-soft: #fff8c5;
        --success: #1a7f37;
        --review-highlight-bg: rgba(9, 105, 218, 0.16);
        --review-highlight-fg: #1f2328;
        --review-highlight-edge: #0969da;
        --shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
        --shadow-small: 0 3px 12px rgba(140, 149, 159, 0.16);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #181a1e;
        --paper: #212429;
        --ink: #d8dce2;
        --muted: #a0a7b0;
        --line: #3a3f46;
        --control-line: #6e7681;
        --soft: #292d33;
        --accent: #91b4f2;
        --accent-soft: #2a374b;
        --on-accent: #172033;
        --danger: #e99a92;
        --warning: #d29922;
        --warning-soft: #3d2f12;
        --success: #89c99a;
        --review-highlight-bg: rgba(145, 180, 242, 0.2);
        --review-highlight-fg: #e6edf3;
        --review-highlight-edge: #91b4f2;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        --shadow-small: 0 3px 14px rgba(0, 0, 0, 0.26);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
      }
      body,
      button,
      textarea {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
      }
      body {
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        color: inherit;
      }
      button:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .launcher {
        display: flex;
        align-items: center;
        min-height: 68px;
        padding: 9px;
        background: var(--bg);
      }
      .launcher-button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        cursor: pointer;
        text-align: left;
      }
      .launcher-button:hover {
        border-color: var(--accent);
        background: var(--soft);
      }
      .launcher-icon {
        display: grid;
        place-items: center;
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .launcher-copy {
        min-width: 0;
        flex: 1;
      }
      .launcher-title {
        display: block;
        overflow: hidden;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .launcher-meta {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .launcher-arrow {
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .launcher-arrow .ui-icon {
        width: 17px;
        height: 17px;
      }

      .full-surface {
        display: none;
        width: 100%;
        height: 100vh;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      html[data-surface="review"] .full-surface {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      html[data-surface="review"][data-display-mode="inline"] .full-surface {
        height: auto;
        min-height: 640px;
      }
      html[data-surface="review"] .launcher {
        display: none;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        min-height: 58px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        backdrop-filter: blur(12px);
      }
      .identity {
        min-width: 0;
        flex: 1;
      }
      .title {
        overflow: hidden;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      h1.title {
        margin: 0;
        font-size: 14px;
        line-height: 1.35;
      }
      .review-help {
        position: relative;
        flex: 0 0 auto;
      }
      .review-help-trigger {
        color: var(--muted);
      }
      .review-help-tooltip {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 50;
        width: max-content;
        max-width: min(320px, calc(100vw - 24px));
        padding: 7px 9px;
        border: 1px solid var(--control-line);
        border-radius: 6px;
        background: var(--ink);
        box-shadow: var(--shadow-small);
        color: var(--paper);
        font-size: 12px;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-2px);
        transition:
          opacity 0.12s ease,
          transform 0.12s ease,
          visibility 0.12s;
        visibility: hidden;
        white-space: nowrap;
      }
      .review-help-tooltip::before {
        position: absolute;
        top: -5px;
        right: 14px;
        width: 8px;
        height: 8px;
        border-top: 1px solid var(--control-line);
        border-left: 1px solid var(--control-line);
        background: var(--ink);
        content: "";
        transform: rotate(45deg);
      }
      .review-help-tooltip kbd {
        font: inherit;
        font-weight: 650;
      }
      .review-help:hover .review-help-tooltip,
      .review-help:focus-within .review-help-tooltip {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }
      .actions,
      .composer-actions,
      .card-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .button {
        min-height: 40px;
        padding: 7px 12px;
        border: 1px solid var(--control-line);
        border-radius: 7px;
        background: var(--paper);
        cursor: pointer;
        font-size: 13px;
        font-weight: 550;
      }
      .button.with-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .button:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--soft);
      }
      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
      .button.danger {
        color: var(--danger);
      }
      .button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .icon-button {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--control-line);
        border-radius: 7px;
        background: var(--paper);
        cursor: pointer;
      }
      .icon-button:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--soft);
      }
      .icon-button:active:not(:disabled),
      .button:active:not(:disabled) {
        transform: translateY(1px);
      }
      .icon-button.compact {
        width: 32px;
        height: 32px;
        border-color: transparent;
        border-radius: 6px;
        background: transparent;
      }
      .ui-icon {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        fill: currentColor;
        stroke: none;
      }
      .theme-icon-sun {
        display: none;
      }
      html[data-theme="dark"] .theme-icon-moon {
        display: none;
      }
      html[data-theme="dark"] .theme-icon-sun {
        display: block;
      }
      .queue-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        margin-left: 5px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
      }

      .workspace {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 24px 24px 92px;
      }
      .review-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        width: 100%;
        min-width: 0;
        min-height: 0;
      }
      html[data-comments-open="true"] .review-layout {
        grid-template-columns: minmax(0, 1fr) clamp(148px, 38vw, 380px);
      }
      .paper {
        width: min(980px, 100%);
        margin: 0 auto;
        padding: clamp(24px, 5vw, 56px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      .markdown {
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 16px;
        line-height: 1.5;
        overflow-wrap: break-word;
      }
      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5,
      .markdown h6 {
        margin: 24px 0 16px;
        font-weight: 600;
        line-height: 1.25;
      }
      .markdown h1 {
        margin-top: 0;
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--line);
        font-size: 2em;
      }
      .markdown h2 {
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--line);
        font-size: 1.5em;
      }
      .markdown h3 {
        font-size: 1.25em;
      }
      .markdown h4 {
        font-size: 1em;
      }
      .markdown h5 {
        font-size: 0.875em;
      }
      .markdown h6 {
        color: var(--muted);
        font-size: 0.85em;
      }
      .markdown p,
      .markdown blockquote,
      .markdown ul,
      .markdown ol,
      .markdown pre,
      .markdown table {
        margin: 0 0 16px;
      }
      .markdown ul,
      .markdown ol {
        padding-left: 2em;
      }
      .markdown li + li {
        margin-top: 0.25em;
      }
      .markdown a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.16em;
      }
      .markdown a:hover {
        text-decoration-thickness: 2px;
      }
      .markdown blockquote {
        padding: 0 1em;
        border-left: 0.25em solid var(--line);
        color: var(--muted);
      }
      .markdown code {
        padding: 0.2em 0.4em;
        border-radius: 6px;
        background: var(--soft);
        font:
          85%/1.45 ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          monospace;
      }
      .markdown pre {
        overflow: auto;
        padding: 16px;
        border-radius: 6px;
        background: var(--soft);
      }
      .markdown pre code {
        padding: 0;
        background: transparent;
        font-size: 100%;
      }
      .markdown table {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: auto;
        border-spacing: 0;
        border-collapse: collapse;
      }
      .markdown th,
      .markdown td {
        padding: 6px 13px;
        border: 1px solid var(--line);
      }
      .markdown tr:nth-child(2n) {
        background: var(--soft);
      }
      .markdown hr {
        height: 0.25em;
        margin: 24px 0;
        border: 0;
        background: var(--line);
      }
      .image-review-target {
        position: relative;
        display: grid;
        place-items: center;
        width: fit-content;
        min-width: 24px;
        min-height: 24px;
        max-width: 100%;
        margin: 0 0 16px;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        line-height: 0;
      }
      .image-review-target::after {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--control-line);
        border-radius: 999px;
        background: color-mix(in srgb, var(--paper) 92%, transparent);
        color: var(--ink);
        box-shadow: var(--shadow-small);
        content: "+";
        font-size: 18px;
        font-weight: 650;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.86);
        transition:
          opacity 120ms ease,
          transform 120ms ease,
          visibility 0s linear 120ms;
        visibility: hidden;
      }
      @media (hover: hover) and (pointer: fine) {
        .image-review-target:hover::after {
          visibility: visible;
          border-color: var(--accent);
          background: var(--accent);
          color: var(--on-accent);
          opacity: 1;
          transform: scale(1);
          transition-delay: 0s;
        }
      }
      .image-review-target:focus-visible::after,
      .image-review-target:active::after {
        visibility: visible;
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
        opacity: 1;
        transform: scale(1);
        transition-delay: 0s;
      }
      .image-review-target:focus-visible,
      .image-review-target.is-selected {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .image-review-target.has-comments {
        background: var(--review-highlight-bg);
        box-shadow: 0 0 0 3px var(--review-highlight-edge);
      }
      .image-review-target canvas.local-image-canvas {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        pointer-events: none;
      }
      .image-review-target.is-downsampled canvas.local-image-canvas {
        width: 100%;
      }
      .markdown img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .local-image {
        display: grid;
        place-items: center;
        min-height: 120px;
        margin-bottom: 16px;
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        background: var(--soft);
        text-align: center;
      }
      .local-image-status {
        color: var(--muted);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .local-image.is-error .local-image-status {
        color: var(--danger);
      }
      .image-retry {
        margin-top: 10px;
      }

      .review-block {
        position: relative;
        border-radius: 4px;
        outline: 0 solid transparent;
      }
      .review-block.has-comments {
        box-shadow: inset -2px 0 var(--accent-soft);
      }
      ::highlight(review-comments) {
        background: var(--review-highlight-bg);
        color: var(--review-highlight-fg);
      }
      mark.review-highlight {
        padding: 0;
        background: var(--review-highlight-bg);
        color: var(--review-highlight-fg);
        border-radius: 2px;
      }
      .review-block.is-selected {
        background: color-mix(in srgb, var(--accent-soft) 38%, transparent);
        box-shadow: inset 3px 0 var(--accent);
        outline: 0;
      }
      .review-block:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .selection-action {
        position: fixed;
        z-index: 60;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--accent);
        border-radius: 50%;
        background: var(--paper);
        color: var(--accent);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .selection-action .ui-icon {
        width: 16px;
        height: 16px;
      }
      .selection-action:hover {
        background: var(--accent);
        color: var(--on-accent);
      }
      .review-context-menu {
        position: fixed;
        z-index: 90;
        width: min(248px, calc(100vw - 16px));
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
        color: var(--ink);
      }
      .review-context-item {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 36px;
        padding: 7px 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
      }
      .review-context-item:hover:not(:disabled),
      .review-context-item:focus {
        outline: 0;
        background: var(--accent-soft);
        color: var(--ink);
      }
      .review-context-item:disabled {
        opacity: 0.48;
        cursor: default;
      }
      .review-context-separator {
        height: 1px;
        margin: 5px 7px;
        background: var(--line);
      }
      .annotation-badge {
        position: absolute;
        z-index: 20;
        display: grid;
        place-items: center;
        right: -38px;
        width: 30px;
        height: 30px;
        padding: 0;
        transform: translateY(4px);
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
        box-shadow:
          0 0 0 1px var(--accent),
          var(--shadow-small);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        user-select: none;
      }
      .annotation-badge::before {
        position: absolute;
        inset: -7px;
        content: "";
      }
      .annotation-badge:hover {
        filter: brightness(1.08);
        transform: translateY(3px) scale(1.04);
      }
      .annotation-badge.is-stale {
        background: var(--warning);
        box-shadow:
          0 0 0 1px var(--warning),
          var(--shadow-small);
      }
      .inline-composer {
        position: relative;
        width: min(440px, calc(100% - 12px));
        margin: 8px 0 14px auto;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 8px 24px rgba(140, 149, 159, 0.18);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      html[data-theme="dark"] .inline-composer {
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34);
      }
      .inline-composer::before {
        position: absolute;
        top: -5px;
        right: 18px;
        width: 9px;
        height: 9px;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
        background: var(--paper);
        content: "";
        transform: rotate(45deg);
      }
      .composer-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 6px;
      }
      .inline-composer .composer-title {
        flex: 1;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 13px;
        font-weight: 650;
        line-height: 1.3;
      }
      .line-pill {
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font:
          600 10px/1.5 ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          monospace;
      }
      .inline-composer .quote {
        display: -webkit-box;
        max-height: 40px;
        overflow: hidden;
        margin: 0 0 8px;
        padding: 5px 8px;
        border-left: 2px solid var(--line);
        background: var(--soft);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        white-space: normal;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      textarea {
        width: 100%;
        min-height: 64px;
        max-height: 120px;
        resize: none;
        padding: 8px 10px;
        border: 1px solid var(--control-line);
        border-radius: 7px;
        background: var(--paper);
        color: var(--ink);
        font-size: 13px;
      }
      .composer-help-popover {
        position: absolute;
        top: 42px;
        right: 42px;
        z-index: 4;
        width: min(248px, calc(100% - 24px));
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        box-shadow: var(--shadow-small);
        color: var(--ink);
      }
      .inline-composer .composer-help-title {
        margin: 0 0 7px;
        font-size: 11px;
        font-weight: 650;
      }
      .composer-help-grid {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 5px 10px;
        margin: 0;
        font-size: 11px;
      }
      .composer-help-grid dt,
      .composer-help-grid dd {
        margin: 0;
      }
      .composer-help-grid dd {
        color: var(--muted);
      }
      .composer-help-grid kbd,
      .composer-help-grid code {
        display: inline-flex;
        min-height: 20px;
        align-items: center;
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--soft);
        color: var(--ink);
        font:
          10px/1.2 ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          monospace;
      }
      .composer-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-top: 7px;
      }
      .inline-composer .reference-help {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 11px;
      }
      .reference-help:empty {
        display: none;
      }
      .reference-help.warning {
        color: var(--warning);
      }
      .composer-source-warning,
      .session-recovery-alert {
        margin: 0 0 8px;
        padding: 8px 10px;
        border: 1px solid var(--warning);
        border-radius: 7px;
        background: color-mix(in srgb, var(--warning) 10%, var(--paper));
        color: var(--ink);
        font-size: 12px;
        line-height: 1.45;
      }
      .session-recovery-alert {
        margin-bottom: 18px;
      }
      .session-recovery-alert p {
        margin: 0 0 8px;
      }
      .manual-copy-dialog {
        position: fixed;
        z-index: 120;
        display: grid;
        inset: 0;
        place-items: center;
        padding: 20px;
        background: rgba(27, 31, 36, 0.45);
      }
      .manual-copy-panel {
        width: min(620px, 100%);
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      .manual-copy-panel h2 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      .manual-copy-panel p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .manual-copy-field {
        min-height: 160px;
        max-height: 50vh;
        margin-bottom: 12px;
        resize: vertical;
        font-family:
          ui-monospace,
          SFMono-Regular,
          SF Mono,
          Menlo,
          Consolas,
          monospace;
      }
      .composer-actions .button {
        min-height: 34px;
        padding: 5px 11px;
        font-size: 12px;
      }

      .queued-group {
        margin: 8px 0 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .document-feedback-group {
        margin: 0 0 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .queued-card {
        margin-top: 7px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        background: var(--soft);
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-label {
        flex: 1;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .card-feedback {
        margin: 6px 0 8px;
        white-space: pre-wrap;
        font-size: 13px;
      }
      .card-quote {
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .card-actions .button {
        min-height: 36px;
        padding: 5px 9px;
        font-size: 12px;
      }
      .status-chip {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 650;
      }
      .status-chip.sent {
        background: var(--soft);
        color: var(--muted);
      }
      .status-chip.warning {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .comments-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border-left: 1px solid var(--control-line);
        background: var(--soft);
      }
      .comments-head {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
      }
      .comments-title {
        flex: 1;
        margin: 0;
        font-size: 15px;
      }
      .comments-list {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
        min-width: 0;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 12px;
      }
      .comment-index-item {
        min-width: 0;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }
      .comment-index-head {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .comment-index-serial {
        color: var(--accent);
        font-weight: 700;
      }
      .comment-index-quote {
        overflow: hidden;
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow-wrap: anywhere;
      }
      .comment-index-feedback {
        margin-top: 4px;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .comment-index-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 9px;
      }
      .comment-index-actions .button {
        min-height: 36px;
        padding: 5px 9px;
        font-size: 12px;
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 300px;
        padding: 30px;
        color: var(--muted);
        text-align: center;
      }
      .error {
        color: var(--danger);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 80;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 7px;
        background: var(--ink);
        color: var(--paper);
        opacity: 0;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        pointer-events: auto;
      }
      .toast-action {
        min-height: 30px;
        padding: 3px 7px;
        border: 1px solid currentColor;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-weight: 650;
      }
      @media (max-width: 700px) {
        .workspace {
          padding: 0;
        }
        .paper {
          padding: 24px 20px 80px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .actions .label {
          display: none;
        }
        .annotation-badge {
          right: -16px;
        }
        .inline-composer {
          width: 100%;
          margin-top: 8px;
        }
        .card-actions .button {
          flex: 1 1 42%;
        }
      }
      @media (max-width: 520px) {
        .markdown {
          font-size: 15px;
        }
        .markdown h1 {
          font-size: 1.5em;
        }
        .markdown h2 {
          font-size: 1.25em;
        }
        .comments-head,
        .comments-list {
          padding: 8px;
        }
        .comment-index-item {
          padding: 8px;
        }
        .comment-index-head {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .comment-index-actions .button {
          flex: 1 1 100%;
        }
        .inline-composer .composer-help-popover {
          top: 41px;
          right: -1px;
          bottom: -1px;
          left: -1px;
          width: auto;
          border-radius: 0 0 8px 8px;
          box-shadow: none;
        }
      }
      @media (max-width: 430px) {
        .topbar {
          gap: 7px;
          padding: 8px;
        }
        .identity {
          display: none;
        }
        .review-help {
          display: none;
        }
        .actions {
          width: 100%;
          justify-content: flex-end;
        }
        .actions {
          gap: 5px;
        }
        .button,
        .icon-button {
          min-height: 38px;
        }
        .icon-button {
          width: 38px;
          height: 38px;
        }
      }
      @media (max-width: 260px) {
        .actions {
          justify-content: center;
        }
        #comments-toggle,
        #review-actions,
        #send-all {
          width: 38px;
          height: 38px;
          padding: 0;
        }
        #top-count,
        #send-all-count {
          display: none;
        }
      }
      @media (pointer: coarse) {
        .icon-button.compact {
          width: 40px;
          height: 40px;
        }
        .review-context-item {
          min-height: 40px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
        }
        .annotation-badge:hover,
        .icon-button:active:not(:disabled),
        .button:active:not(:disabled),
        .review-help-tooltip {
          transform: none;
        }
      }
      @media (forced-colors: active) {
        .paper,
        .inline-composer,
        .queued-card,
        .comment-index-item,
        .comments-panel,
        .review-context-menu,
        button,
        textarea {
          border-color: CanvasText;
        }
        .review-block.is-selected {
          outline: 2px solid Highlight;
        }
        .review-context-item:focus {
          outline: 2px solid Highlight;
          outline-offset: -2px;
        }
        ::highlight(review-comments) {
          background: Highlight;
          color: HighlightText;
          text-decoration-color: HighlightText;
        }
        mark.review-highlight {
          background: Highlight;
          color: HighlightText;
          text-decoration-color: HighlightText;
        }
        .image-review-target:focus-visible,
        .image-review-target.is-selected,
        .image-review-target.has-comments {
          outline: 3px solid Highlight;
          box-shadow: none;
        }
        .image-review-target::after {
          border-color: ButtonText;
          background: ButtonFace;
          color: ButtonText;
        }
        .annotation-badge {
          border-color: Canvas;
          outline: 2px solid ButtonText;
          background: ButtonFace;
          color: ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <div class="launcher" id="launcher">
      <button
        class="launcher-button"
        id="open-review"
        type="button"
        aria-label="Open Markdown review fullscreen"
      >
        <span class="launcher-icon" aria-hidden="true">
          <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">

        </span>
        <span class="launcher-copy">

          <span class="launcher-meta" id="launcher-meta">Open fullscreen review</span>
        </span>
        <span class="queue-count" id="launcher-count" hidden>0</span>
        <span class="launcher-arrow" aria-hidden="true">
          <svg class="ui-icon" viewBox="0 0 16 16">
            <path
              d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"
            ></path>
          </svg>
        </span>
      </button>
    </div>

    <div class="full-surface">
      <header class="topbar">
        <div class="identity">
          <h1 class="title" id="title">Markdown Review</h1>
          <div class="meta" id="meta" role="status" aria-live="polite">
            Waiting for the document…

        </div>
        <div class="actions">
          <div class="review-help">
            <button

              type="button"
              aria-label="Review help"
              aria-describedby="review-help-tooltip"
            >
              <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5H8v-2h-.75a.75.75 0 0 1-.75-.75ZM8 4a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"
                ></path>

            <span class="review-help-tooltip" id="review-help-tooltip" role="tooltip">
              Right-click or use Review actions · <kbd>⌘/Ctrl + Shift + M</kbd> comments on a
              selection
            </span>
          </div>
          <button
            class="button with-icon"
            id="review-actions"
            type="button"
            aria-label="Review actions"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="review-context-menu"
          >
            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M3 9.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm5 0a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm5 0a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Z"
              ></path>
            </svg>
            <span class="label">Review</span>
          </button>
          <button
            class="button with-icon"
            id="comments-toggle"

          >
            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M1.75 1h8.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 10.25 10H7.061l-2.574 2.573A1.458 1.458 0 0 1 2 11.543V10h-.25A1.75 1.75 0 0 1 0 8.25v-5.5C0 1.784.784 1 1.75 1ZM1.5 2.75v5.5c0 .138.112.25.25.25h1a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h3.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25Zm13 2a.25.25 0 0 0-.25-.25h-.5a.75.75 0 0 1 0-1.5h.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 14.25 12H14v1.543a1.458 1.458 0 0 1-2.487 1.03L9.22 12.28a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.22 2.22v-2.19a.75.75 0 0 1 .75-.75h1a.25.25 0 0 0 .25-.25Z"
              ></path>
            </svg>
            <span class="label">Comments</span><span class="queue-count" id="top-count">0</span>
          </button>
          <button class="button primary with-icon" id="send-all" type="button" hidden>
            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M.989 8 .064 2.68a1.342 1.342 0 0 1 1.85-1.462l13.402 5.744a1.13 1.13 0 0 1 0 2.076L1.913 14.782a1.343 1.343 0 0 1-1.85-1.463L.99 8Zm.603-5.288L2.38 7.25h4.87a.75.75 0 0 1 0 1.5H2.38l-.788 4.538L13.929 8Z"
              ></path>
            </svg>
            <span class="label" id="send-all-label">Submit</span
            ><span id="send-all-count">(0)</span>
          </button>

          >
            <svg class="ui-icon theme-icon-moon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.499 5.499 0 1 0 7.678-7.678Z"

            </svg>
            <svg class="ui-icon theme-icon-sun" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8Zm-8 5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm3.536-1.464a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-1.06-1.06a.75.75 0 0 1 0-1.06Z"

            <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"

        </div>
      </header>
      <div class="review-layout">
        <main class="workspace">
          <article
            class="paper markdown"
            id="document"
            aria-labelledby="title"
            aria-busy="false"
            tabindex="0"
          >
            <div class="empty">Opening Markdown review…</div>
          </article>
        </main>
        <aside
          class="comments-panel"
          id="comments-panel"
          aria-labelledby="comments-title"
          aria-busy="false"
          hidden
        >
          <div class="comments-head">
            <h2 class="comments-title" id="comments-title">Comments</h2>
            <button
              class="icon-button compact"
              id="close-comments"
              type="button"
              aria-label="Close comments"
            >
              <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"
                ></path>
              </svg>
            </button>
          </div>
          <div class="comments-list" id="comments-list" role="list"></div>
        </aside>
      </div>
    </div>

    <button
      class="selection-action"
      id="selection-action"
      type="button"
      aria-label="Add feedback for selection"
      aria-keyshortcuts="Control+Shift+M Meta+Shift+M"
      title="Add feedback"
      hidden
    >
      <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"
        ></path>
      </svg>
    </button>

    <div
      class="review-context-menu"
      id="review-context-menu"
      role="menu"
      aria-label="Review actions"
      hidden
    >
      <button
        class="review-context-item"
        id="context-copy-selection"
        type="button"
        role="menuitem"
        data-context-action="copy-selection"
      >
        Copy selected text
      </button>
      <button
        class="review-context-item"
        id="context-comment-selection"
        type="button"
        role="menuitem"
        data-context-action="comment-selection"
      >
        Comment on selection
      </button>
      <button
        class="review-context-item"
        id="context-comment-image"
        type="button"
        role="menuitem"
        data-context-action="comment-image"
      >
        Comment on image
      </button>
      <div class="review-context-separator" id="context-selection-separator" role="separator"></div>
      <button
        class="review-context-item"
        id="context-comment-document"
        type="button"
        role="menuitem"
        data-context-action="comment-document"
      >
        Comment on whole document
      </button>
    </div>

    <section
      class="inline-composer"
      id="review-composer"
      data-review-ui="composer"
      aria-labelledby="composer-title"
      aria-describedby="line-pill quote feedback-message"
      aria-busy="false"
      hidden
    >
      <div class="composer-head">
        <h2 class="composer-title" id="composer-title">Add feedback</h2>
        <span class="line-pill" id="line-pill">No selection</span>
        <button
          class="icon-button compact"
          id="composer-help-toggle"
          type="button"
          title="Comment shortcuts and references"
          aria-label="Comment shortcuts and references"
          aria-expanded="false"
          aria-controls="composer-help-popover"
        >
          <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"
            ></path>
          </svg>
        </button>
        <button
          class="icon-button compact"
          id="close-composer"
          type="button"
          aria-label="Close feedback editor"
        >
          <svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"
            ></path>
          </svg>
        </button>
      </div>
      <div
        class="composer-help-popover"
        id="composer-help-popover"
        role="region"
        aria-label="Comment help"
        hidden
      >
        <p class="composer-help-title">Comment help</p>
        <dl class="composer-help-grid">
          <dt><kbd>Enter</kbd></dt>
          <dd>Queue comment</dd>
          <dt><kbd>Shift + Enter</kbd></dt>
          <dd>New line</dd>
          <dt><code>#N</code></dt>
          <dd>Reference a queued comment</dd>
          <dt><code>\#N</code></dt>
          <dd>Write literal #N</dd>
        </dl>
      </div>
      <blockquote class="quote" id="quote"></blockquote>
      <label class="sr-only" for="feedback">Feedback to Codex</label>
      <textarea
        id="feedback"
        rows="2"
        maxlength="2400"
        placeholder="Leave feedback for Codex…"
        aria-describedby="line-pill quote feedback-message"
        aria-keyshortcuts="Enter"
      ></textarea>
      <p
        class="reference-help"
        id="feedback-message"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
      <div class="composer-footer">
        <div class="composer-actions">
          <button
            class="button primary"
            id="add-queue"
            type="button"
            aria-label="Queue feedback"
            disabled
          >
            <span id="add-queue-label">Queue</span>
          </button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span id="toast-message"></span
      ><button class="toast-action" id="toast-action" type="button" hidden></button>
    </div>
    <div
      class="sr-only"
      id="selection-status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <!-- MARKDOWN_REVIEW_APP -->
  </body>
</html>
